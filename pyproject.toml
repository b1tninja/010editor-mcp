[project]
name = "010editor-mcp"
version = "0.1.0"
description = "MCP server for SweetScape 010 Editor — run Binary Templates (.bt) and Scripts (.1sc) headlessly"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "b1tninja" }]
keywords = ["mcp", "010editor", "binary-templates", "hex-editor"]
dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
010editor-mcp = "editor010_mcp.server:main"

[project.urls]
Homepage = "https://github.com/b1tninja/010editor-mcp"
Repository = "https://github.com/b1tninja/010editor-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editor010_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
